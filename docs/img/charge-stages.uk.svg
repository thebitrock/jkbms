0" width="310" height="56" rx="28.0" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><circle cx="220.0" cy="152" r="13.5" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="220.0" y="157.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="364.0" y="148.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >напруга батареї</text><text x="364.0" y="167.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >вища за RCV × комірки</text><rect x="529.0" y="124.0" width="322" height="56" rx="28.0" fill="#fff" stroke="#059669" stroke-width="1.8"/><circle cx="554.0" cy="152" r="13.5" fill="#059669" stroke="#fff" stroke-width="2.5"/><text x="554.0" y="157.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="704.0" y="148.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >RCV Time минув і напруга</text><text x="704.0" y="167.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >вища за SOC-100% Volt. × комірки</text><rect x="185.0" y="472.0" width="330" height="56" rx="28.0" fill="#fff" stroke="#D97706" stroke-width="1.8"/><circle cx="210.0" cy="500" r="13.5" fill="#D97706" stroke="#fff" stroke-width="2.5"/><text x="210.0" y="505.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="364.0" y="496.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >RCV Time минув, але напруга</text><text x="364.0" y="515.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >не вища за SOC-100% Volt. × комірки</text><rect x="310.0" y="570.0" width="500" height="44" rx="22.0" fill="#fff" stroke="#D97706" stroke-width="1.8"/><circle cx="335.0" cy="592" r="13.5" fill="#D97706" stroke="#fff" stroke-width="2.5"/><text x="335.0" y="597.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="574" y="597" font-size="14.5" fill="#1F2328" t