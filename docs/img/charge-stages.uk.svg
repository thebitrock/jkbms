text><text x="520.0" y="421.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >триває рівно RCV Time</text><rect x="720" y="218" width="280" height="218" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/><path d="M720,272 V232 Q720,218 734,218 H986 Q1000,218 1000,232 V272 z" fill="#059669"/><text x="860.0" y="253.0" font-size="21" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">FLOAT</text><text x="860.0" y="302.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >BMS просить в інвертора</text><text x="860.0" y="334.0" font-size="25" font-weight="700" fill="#065F46" text-anchor="middle" >RFV × комірки</text><text x="860.0" y="359.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >приклад: 3,35 В × 16 = 53,6 В</text><line x1="746" y1="376" x2="974" y2="376" stroke="#D0D7DE"/><text x="860.0" y="400.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="middle" >Підтримка</text><text x="860.0" y="421.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >нижча напруга, без таймера</text><rect x="40" y="632" width="960" height="34" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/><text x="520.0" y="654.0" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >Charging Float Mode вимкнено: стадій немає. BMS завжди просить RCV × комірки.</text></svg>
