<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 896" width="760" height="896" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Charge stages (Charging Float Mode on)"><title>Charge stages (Charging Float Mode on)</title><desc>The BMS tells the inverter which voltage to charge to. It moves between three stages.</desc><rect x="0.5" y="0.5" width="759" height="895" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><defs><marker id="ah-bulk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#D97706"/></marker><marker id="ah-abs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2563EB"/></marker><marker id="ah-flt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#059669"/></marker></defs><text x="36.0" y="50.0" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start" >Charge stages (Charging Float Mode on)</text><text x="36.0" y="78.0" font-size="15" font-weight="400" fill="#59636E" text-anchor="start" >The BMS tells the inverter which voltage to charge to.</text><text x="36.0" y="98.0" font-size="15" font-weight="400" fill="#59636E" text-anchor="start" >It moves between three stages.</text><path d="M340.0,265 V347" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-abs)"/><path d="M190,499 V587" fill="none" stroke="#059669" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-flt)"/><path d="M490,499 V542.0" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M490,542.0 H704" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.0,739 V788" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340.0,788 H684 Q704,788 704,768 V234.0 Q704,214.0 684,214.0 H650" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-bulk)"/><circle cx="704" cy="542.0" r="5" fill="#D97706"/><text x="726" y="378.0" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle" transform="rotate(-90 726 378.0)">back to Bulk</text><rect x="145.0" y="282.0" width="390" height="46" rx="23.0" fill="#fff" stroke="#2563EB" stroke-width="1.8"/><circle cx="170.0" cy="305.0" r="13.5" fill="#2563EB" stroke="#fff" stroke-width="2.5"/><text x="170.0" y="310.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="354.0" y="310.0" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >battery voltage is above RCV × cells</text><rect x="48.0" y="515.0" width="284" height="54" rx="27.0" fill="#fff" stroke="#059669" stroke-width="1.8"/><circle cx="73.0" cy="542.0" r="13.5" fill="#059669" stroke="#fff" stroke-width="2.5"/><text x="73.0" y="547.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="204.0" y="538.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >battery voltage is above</text><text x="204.0" y="557.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >SOC-100% Volt. × cells</text><rect x="345.0" y="515.0" width="290" height="54" rx="27.0" fill="#fff" stroke="#D97706" stroke-width="1.8"/><circle cx="370.0" cy="542.0" r="13.5" fill="#D97706" stroke="#fff" stroke-width="2.5"/><text x="370.0" y="547.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="504.0" y="538.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >battery voltage is not above</text><text x="504.0" y="557.5" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >SOC-100% Volt. × cells</text><rect x="70.0" y="765.0" width="540" height="46" rx="23.0" fill="#fff" stroke="#D97706" stroke-width="1.8"/><circle cx="95.0" cy="788" r="13.5" fill="#D97706" stroke="#fff" stroke-width="2.5"/><text x="95.0" y="793.2" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="354.0" y="793" font-size="14.5" fill="#1F2328" text-anchor="middle"><tspan font-weight="700" fill="#92400E">Re-Bulk:</tspan> <tspan font-weight="500">SOC has fallen by Re-Bulk SOC since Float began</tspan></text><rect x="40" y="122" width="600" height="140" rx="14" fill="#fff" stroke="#D97706" stroke-width="2"/><path d="M40,168 V136 Q40,122 54,122 H626 Q640,122 640,136 V168 z" fill="#D97706"/><text x="340.0" y="153.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">BULK</text><text x="220.0" y="194.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >The BMS asks the inverter for</text><text x="220.0" y="224.0" font-size="26" font-weight="700" fill="#92400E" text-anchor="middle" >RCV × cells</text><text x="220.0" y="247.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >example: 3.45 V × 16 = 55.2 V</text><line x1="400" y1="184" x2="400" y2="248" stroke="#D0D7DE"/><text x="422.0" y="214.0" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >Main charge</text><text x="422.0" y="235.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >the battery fills up</text><rect x="40" y="356" width="600" height="140" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2"/><path d="M40,402 V370 Q40,356 54,356 H626 Q640,356 640,370 V402 z" fill="#2563EB"/><text x="340.0" y="387.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">ABSORPTION</text><text x="220.0" y="428.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >The BMS asks the inverter for</text><text x="220.0" y="458.0" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle" >RCV × cells</text><text x="220.0" y="481.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >example: 3.45 V × 16 = 55.2 V</text><line x1="400" y1="418" x2="400" y2="482" stroke="#D0D7DE"/><text x="422.0" y="438.0" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >Top-up</text><text x="422.0" y="459.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >lasts exactly RCV Time,</text><text x="422.0" y="478.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >then one check</text><rect x="40" y="596" width="600" height="140" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/><path d="M40,642 V610 Q40,596 54,596 H626 Q640,596 640,610 V642 z" fill="#059669"/><text x="340.0" y="627.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">FLOAT</text><text x="220.0" y="668.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >The BMS asks the inverter for</text><text x="220.0" y="698.0" font-size="26" font-weight="700" fill="#065F46" text-anchor="middle" >RFV × cells</text><text x="220.0" y="721.0" font-size="14" font-weight="400" fill="#59636E" text-anchor="middle" >example: 3.35 V × 16 = 53.6 V</text><line x1="400" y1="658" x2="400" y2="722" stroke="#D0D7DE"/><text x="422.0" y="678.0" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >Rest</text><text x="422.0" y="699.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >lower voltage,</text><text x="422.0" y="718.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >no time limit</text><rect x="40" y="840" width="680" height="36" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/><text x="380.0" y="863.0" font-size="14.5" font-weight="500" fill="#1F2328" text-anchor="middle" >Charging Float Mode off: no stages. The BMS always asks for RCV × cells.</text></svg>
