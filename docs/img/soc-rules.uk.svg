<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 394" width="1040" height="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Як SOC стає 100 % і 0 %"><title>Як SOC стає 100 % і 0 %</title><desc>Посередині BMS рахує струм. Обидва краї задає напруга комірок.</desc><rect x="0.5" y="0.5" width="1039" height="393" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><text x="40.0" y="48.0" font-size="23" font-weight="700" fill="#1F2328" text-anchor="start" >Як SOC стає 100 % і 0 %</text><text x="40.0" y="75.0" font-size="15" font-weight="400" fill="#59636E" text-anchor="start" >Посередині BMS рахує струм. Обидва краї задає напруга комірок.</text><rect x="120" y="116" width="800" height="56" rx="28.0" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><path d="M212,116 H148.0 A28.0,28.0 0 0 0 148.0,172 H212 z" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><path d="M828,116 H892.0 A28.0,28.0 0 0 1 892.0,172 H828 z" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="170.0" y="150.0" font-size="17" font-weight="700" fill="#991B1B" text-anchor="middle" >0 %</text><text x="870.0" y="150.0" font-size="17" font-weight="700" fill="#065F46" text-anchor="middle" >100 %</text><text x="520.0" y="149.5" font-size="15.5" font-weight="600" fill="#4C1D95" text-anchor="middle" >1 % … 99 %: рахується за струмом заряду і розряду</text><line x1="170.0" y1="172" x2="170.0" y2="214" stroke="#DC2626" stroke-width="2"/><circle cx="170.0" cy="172" r="4" fill="#DC2626"/><rect x="40" y="214" width="440" height="126" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="62.0" y="247.0" font-size="17" font-weight="700" fill="#991B1B" text-anchor="start" >0 % задає напруга</text><text x="62.0" y="274.0" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Найнижча комірка тримається на SOC-0% Volt.</text><text x="62.0" y="294.0" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >або нижче 4 секунди.</text><line x1="870.0" y1="172" x2="870.0" y2="214" stroke="#059669" stroke-width="2"/><circle cx="870.0" cy="172" r="4" fill="#059669"/><rect x="560" y="214" width="440" height="126" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="582.0" y="247.0" font-size="17" font-weight="700" fill="#065F46" text-anchor="start" >100 % задає напруга</text><text x="582.0" y="274.0" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Float Mode вимкнено або адреса 1–15: найвища</text><text x="582.0" y="294.0" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >комірка тримає SOC-100% Volt. 4 секунди.</text><text x="582.0" y="320.0" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Float Mode увімкнено, адреса 0: з початком Float.</text><text x="520.0" y="372.0" font-size="14.5" font-weight="500" fill="#59636E" text-anchor="middle" >Сам підрахунок зупиняється на 99 % вгору і на 1 % вниз.</text></svg>
