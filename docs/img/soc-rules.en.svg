<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" width="760" height="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="How SOC gets to 100 % and to 0 %"><title>How SOC gets to 100 % and to 0 %</title><desc>In between, the BMS counts the current. The two ends are set by cell voltage.</desc><rect x="0.5" y="0.5" width="759" height="535" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><text x="36.0" y="50.0" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start" >How SOC gets to 100 % and to 0 %</text><text x="36.0" y="78.0" font-size="15" font-weight="400" fill="#59636E" text-anchor="start" >In between, the BMS counts the current. The two ends are set by cell voltage.</text><rect x="56" y="112" width="84" height="400" rx="42.0" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/><path d="M56,174 V154.0 A42.0,42.0 0 0 1 140,154.0 V174 z" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><path d="M56,450 V470.0 A42.0,42.0 0 0 0 140,470.0 V450 z" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="98.0" y="153.0" font-size="17" font-weight="700" fill="#065F46" text-anchor="middle" >100 %</text><text x="98.0" y="484.0" font-size="17" font-weight="700" fill="#991B1B" text-anchor="middle" >0 %</text><text x="98.0" y="198.0" font-size="13.5" font-weight="700" fill="#4C1D95" text-anchor="middle" >99 %</text><text x="98.0" y="436.0" font-size="13.5" font-weight="700" fill="#4C1D95" text-anchor="middle" >1 %</text><path d="M98.0,410 V218" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3 5"/><line x1="140" y1="146" x2="190" y2="146" stroke="#059669" stroke-width="2"/><rect x="190" y="112" width="534" height="136" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="212.0" y="146.0" font-size="17" font-weight="700" fill="#065F46" text-anchor="start" >100 % is set by voltage</text><text x="212.0" y="174.0" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start" >Float Mode on: when Float begins (address 1–15: see the text).</text><text x="212.0" y="204.0" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start" >Float Mode off: when the highest cell has held</text><text x="212.0" y="224.0" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start" >SOC-100% Volt. or above for 4 seconds.</text><line x1="140" y1="312.0" x2="190" y2="312.0" stroke="#7C3AED" stroke-width="2"/><text x="212.0" y="308.0" font-size="17" font-weight="700" fill="#4C1D95" text-anchor="start" >1 % … 99 %: counted from the current in and out</text><text x="212.0" y="332.0" font-size="14.5" font-weight="400" fill="#59636E" text-anchor="start" >Counting alone stops at 99 % on the way up and at 1 % on the way down.</text><line x1="140" y1="478" x2="190" y2="478" stroke="#DC2626" stroke-width="2"/><rect x="190" y="428" width="534" height="84" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/><text x="212.0" y="462.0" font-size="17" font-weight="700" fill="#991B1B" text-anchor="start" >0 % is set by voltage</text><text x="212.0" y="490.0" font-size="14.5" font-weight="400" fill="#1F2328" text-anchor="start" >When the lowest cell has held SOC-0% Volt. or below for 4 seconds.</text></svg>
